services:
  workbench:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8731}:8731"
    volumes:
      - workspace:/app/runtime
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-}
      LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8731/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  workspace:
