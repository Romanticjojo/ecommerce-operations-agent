name: Build and verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m commerce.cli demo && python -m commerce.cli evaluate --mode reference
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: |
          curl --fail http://127.0.0.1:8731/
          curl --fail http://127.0.0.1:8731/api/overview | python -c "import json,sys; assert json.load(sys.stdin)['order_count'] > 0"
          curl --fail -H 'Content-Type: application/json' -d '{"question":"Show monthly delivered orders in 2017.","mode":"demo"}' http://127.0.0.1:8731/api/query | python -c "import json,sys; assert json.load(sys.stdin)['status']=='ok'"
          curl --fail http://127.0.0.1:8731/api/skills | python -c "import json,sys; assert len(json.load(sys.stdin)['skills'])==9"
          curl --fail -H 'Content-Type: application/json' -d '{"question":"Rank merchants","skill_id":"merchant-score"}' http://127.0.0.1:8731/api/query | python -c "import json,sys; r=json.load(sys.stdin); assert r['status']=='ok' and r['mode']=='skill' and r['table']"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
